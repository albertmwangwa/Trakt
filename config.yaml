# Camera configuration (single camera - legacy support)
camera:
  # ONVIF camera connection settings
  host: "192.168.1.100"  # Camera IP address
  port: 80               # ONVIF port (usually 80 or 8080)
  username: "admin"      # Camera username
  password: "password"   # Camera password
  
  # Stream settings
  stream_profile: 0      # Profile token (0 for main stream, 1 for sub stream)
  transport: "tcp"       # Transport protocol: tcp or udp
  
  # Frame capture settings
  fps_limit: 5           # Frames per second to process (lower = less CPU usage)
  resolution:
    width: 1920
    height: 1080

# Multiple cameras configuration
# Use this section to configure multiple simultaneous cameras
cameras:
  enabled: false          # Set to true to enable multi-camera mode
  list:
    - id: "cam_1"
      name: "Front Entrance"
      host: "192.168.1.100"
      port: 80
      username: "admin"
      password: "password"
      stream_profile: 0
      transport: "tcp"
      fps_limit: 5
      enabled: true
    # - id: "cam_2"
    #   name: "Parking Lot"
    #   host: "192.168.1.101"
    #   port: 80
    #   username: "admin"
    #   password: "password"
    #   stream_profile: 0
    #   transport: "tcp"
    #   fps_limit: 5
    #   enabled: true

# OCR configuration
ocr:
  # OCR engine: 'tesseract' or 'easyocr'
  engine: "easyocr"
  
  # Enable EAST text detector for region-based OCR (improves accuracy)
  use_text_detection: false  # Set to true to enable EAST text detection
  
  # Text detection settings (for EAST detector)
  text_detection:
    east_model_path: "./models/frozen_east_text_detection.pb"
    confidence_threshold: 0.5
    nms_threshold: 0.4
    input_width: 320
    input_height: 320
    region_padding: 5  # Pixels to pad around detected regions
  
  # Preprocessing settings for text regions
  preprocessing:
    apply_deskewing: true
    apply_contrast_enhancement: false
    apply_noise_removal: false
    apply_illumination_normalization: true
  
  # Tesseract settings
  tesseract:
    language: "eng"      # OCR language (eng, fra, deu, etc.)
    oem: 3               # OCR Engine Mode (0-3)
    psm: 6               # Page Segmentation Mode (0-13)
    
  # EasyOCR settings
  easyocr:
    languages: ["en"]    # List of languages to recognize
    gpu: false           # Use GPU acceleration
    model_storage_directory: "./models/easyocr"
  
  # Text detection thresholds
  confidence_threshold: 0.5  # Minimum confidence to consider detection valid
  
  # Text filtering
  min_text_length: 2     # Minimum characters to consider
  strict_pattern_matching: false  # Only keep detections matching filter_patterns
  filter_patterns:       # Regex patterns to filter/highlight
    - "[0-9]{3,}"        # Numbers with 3+ digits
    - "[A-Z]{2,}"        # Uppercase sequences

# TensorFlow model configuration
tensorflow:
  # Model settings
  model_path: "./models/custom_ocr_model.h5"  # Path to custom TensorFlow model
  use_pretrained: false  # Use pretrained model if available
  
  # Processing settings
  batch_size: 1
  input_shape: [224, 224, 3]  # Model input shape [height, width, channels]
  
  # GPU settings
  gpu_memory_limit: 2048  # MB, set to null for no limit
  allow_growth: true      # Allow GPU memory to grow as needed

# Output configuration
output:
  # Save detected text
  save_results: true
  results_dir: "./output/results"
  
  # Save annotated frames
  save_frames: true
  frames_dir: "./output/frames"
  save_interval: 30      # Save every N frames
  
  # Logging
  log_level: "INFO"      # DEBUG, INFO, WARNING, ERROR
  log_file: "./output/trakt.log"

# Application settings
app:
  # Reconnection settings
  reconnect_attempts: 5
  reconnect_delay: 5     # seconds
  
  # Performance
  use_threading: true
  num_threads: 2
  
  # Display
  show_preview: false    # Show live preview window
  preview_scale: 0.5     # Scale factor for preview window

# Database configuration
database:
  enabled: true                    # Enable database storage for results
  path: "./output/trakt.db"        # SQLite database file path

# Alert system configuration
alerts:
  enabled: true                    # Enable the alert system
  
  # Alert patterns - regex patterns to trigger alerts
  patterns:
    - name: "license_plate"
      pattern: "[A-Z]{2,3}[0-9]{3,4}[A-Z]{0,2}"  # License plate pattern
      priority: "high"
      enabled: true
      cooldown_seconds: 30         # Minimum seconds between alerts for same pattern
    - name: "numeric_sequence"
      pattern: "[0-9]{4,}"         # 4+ digit numbers
      priority: "normal"
      enabled: true
      cooldown_seconds: 10
    # - name: "custom_pattern"
    #   pattern: "YOUR_REGEX_HERE"
    #   priority: "critical"        # low, normal, high, critical
    #   enabled: true
    #   cooldown_seconds: 60
  
  # Alert handlers
  handlers:
    # Logging handler - logs alerts to application log
    logging:
      enabled: true
      level: "WARNING"             # Log level for alerts
    
    # Webhook handler - sends alerts to HTTP endpoint
    webhook:
      enabled: false
      url: "https://your-webhook-url.com/alerts"
      timeout: 10
      # headers:
      #   Authorization: "Bearer your-token"

# Model training configuration
training:
  # Training parameters
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  
  # Early stopping
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 0.0000001
  
  # Model architecture: "cnn" or "crnn"
  architecture: "cnn"
  
  # Dataset configuration
  dataset:
    image_size: [224, 224]
    channels: 3
    normalize: true
    max_label_length: 32
    charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  
  # Data augmentation
  augmentation:
    enabled: true
    rotation_range: 10
    width_shift_range: 0.1
    height_shift_range: 0.1
    shear_range: 0.1
    zoom_range: 0.1
    brightness_range: [0.8, 1.2]
    noise_stddev: 10
    blur_kernel_range: [1, 3]
  
  # Output paths
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  model_save_path: "./models/trained_ocr_model.h5"
  
  # GPU settings (same as tensorflow section)
  allow_growth: true
  gpu_memory_limit: null  # MB, set to null for no limit
